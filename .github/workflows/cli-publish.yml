name: CLI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Determine version from release tag
        run: echo "HANKO_VERSION=${TAG#backend/}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --snapshot
          workdir: ./backend
        env:
          GORELEASER_CURRENT_TAG: 'v0.0.0' # can be anything since we're using --snapshot
      - run: |
          mkdir -p dist/artifacts
          cp dist/*.{tar.gz,zip} dist/artifacts
        working-directory: ./backend
      - name: Upload assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ./backend/dist/artifacts/*
          fail_on_unmatched_files: true
